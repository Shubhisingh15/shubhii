{% extends "base.html" %}

{% block title %}Create a Post - ShareSphere{% endblock %}

{% block content %}
<section class="create-post-section">
    <h1>Create a New Post</h1>
    <p>Share your thoughts, ideas, or tips with the ShareSphere community.</p>

    <form action="{{ url_for('submit_post') }}" method="POST" enctype="multipart/form-data" class="post-form">
        <div class="form-group">
            <label for="title">Post Title:</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <select id="category" name="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="recipes">Recipes</option>
                <option value="fashion">Fashion</option>
                <option value="reviews">Product Reviews</option>
                <option value="travel">Travel</option>
                <option value="diy">DIY</option>
                <option value="wellness">Wellness</option>
            </select>
        </div>

        <div class="form-group">
            <label for="content">Post Content:</label>
            <textarea id="content" name="content" rows="6" required></textarea>
        </div>

        <div class="form-group">
            <label for="image">Upload Image:</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>

        <button type="submit" class="btn-submit">Publish Post</button>
    </form>
</section>
{% endblock %}
