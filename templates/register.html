{% extends "base.html" %}

{% block title %}Register - ShareSphere{% endblock %}

{% block content %}
<section class="register-section">
    <h1>Create an Account</h1>
    <p>Join ShareSphere and start sharing your passions with the community!</p>
    
    <form action="{{ url_for('register') }}" method="POST" class="register-form">

        <label for="username">Username:</label>
        <input type="text" id="username" class="form-input">

        <label for="email">Email:</label>
        <input type="email" id="email" class="form-input">

        <label for="password">Password:</label>
        <input type="password" id="password" class="form-input">

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm" class="form-input">

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
</section>
{% endblock %}
